# Plugin basic information
pluginGroup=org.zoocode.jetbrains
pluginVersion=3.96.0

# Baseline change from 233 / Java 17 approved by the maintainer on 2026-11-12.
# Platform basic information
platformVersion=2026.1.5.1
# Unified IDEA artifact code; plugin requirements remain platform and terminal only.
platformType=IU
pluginSinceBuild=261.27258.136
pluginUntilBuild=263.*

# The pinned 2026.3 build used by verifyPlugin and smoke263Dispatch. The
# GitHub Actions workflows download the archive once, check it against the
# pinned digest below, and cache the unpacked IDE.
idea263Build=263.7307.112

# SHA-256 of the ideaIC-<idea263Build>-EAP-SNAPSHOT.zip archive. release.yml and
# pr.yml both read this value, so it is pinned in one place.
idea263Sha256=de9832127205a037c5f28d3a1d846c904dc00811772def92bca076f7691d9566

# Other project configurations can be added here
vscodeVersion=1.100.0

# Use the Kotlin runtime bundled with the target IDE.
kotlin.stdlib.default.dependency=false

# Bound worker count and give the modern SDK compiler enough heap on CI.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.workers.max=4
