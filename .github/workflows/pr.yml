name: JetBrains plugin pull request checks

on:
  pull_request:
    paths:
      - "jetbrains_plugin/**"
      - ".github/workflows/pr.yml"

permissions:
  contents: read

concurrency:
  group: jetbrains-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Connector tests, build, and 2026.3 compatibility gates
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the JetBrains plugin
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # One source of truth: the build number and the pinned archive digest
      # live in jetbrains_plugin/gradle.properties, next to each other.
      - name: Read the centralized verification IDE values
        shell: bash
        run: |
          build="$(sed -n 's/^idea263Build=//p' jetbrains_plugin/gradle.properties)"
          digest="$(sed -n 's/^idea263Sha256=//p' jetbrains_plugin/gradle.properties)"
          if [ -z "$build" ] || [ -z "$digest" ]; then
            echo "idea263Build or idea263Sha256 is missing from jetbrains_plugin/gradle.properties."
            exit 1
          fi
          echo "IDEA_263_BUILD=$build" >> "$GITHUB_ENV"
          echo "IDEA_263_SHA256=$digest" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore the cached 2026.3 verification IDE
        id: idea263-cache
        uses: actions/cache@v4
        with:
          path: jetbrains_plugin/build/ideaIC-*
          key: ideaIC-263-${{ env.IDEA_263_SHA256 }}

      # The same pinned download as release.yml: the exact IC-<build> EAP
      # archive is fetched from the IntelliJ snapshots repository, checked
      # against the SHA-256 from gradle.properties, and unpacked once.
      - name: Download and unpack the 2026.3 verification IDE
        working-directory: jetbrains_plugin
        shell: bash
        run: |
          ide_zip="build/ideaIC-${IDEA_263_BUILD}.zip"
          ide_dir="build/ideaIC-${IDEA_263_BUILD}"
          # build/ is gitignored, so a fresh checkout has no build directory.
          # Create it before curl writes the archive.
          mkdir -p build
          if [ -d "$ide_dir/bin" ]; then
            echo "Using cached $ide_dir"
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --location -o "$ide_zip" \
            "https://www.jetbrains.com/intellij-repository/snapshots/com/jetbrains/intellij/idea/ideaIC/${IDEA_263_BUILD}-EAP-SNAPSHOT/ideaIC-${IDEA_263_BUILD}-EAP-SNAPSHOT.zip"
          echo "${IDEA_263_SHA256}  ${ide_zip}" | sha256sum --check --status || {
            echo "Downloaded ideaIC-${IDEA_263_BUILD}.zip does not match the pinned SHA-256 ${IDEA_263_SHA256}."
            exit 1
          }
          unzip -q "$ide_zip" -d "$ide_dir"

      # prepareSandbox copies the extension-host payload into the sandbox. The
      # pull-request gates verify the plugin bytecode and do not need that
      # payload, so the two required input paths are created empty.
      - name: Create the sandbox input paths the Gradle build needs
        working-directory: jetbrains_plugin
        shell: bash
        run: |
          mkdir -p plugins/zoo-code/extension
          touch plugins/zoo-code/extension/.keep prodDep.txt

      # The connector tests are pure JVM tests and the focus of these gates.
      # The platform-fixture tests need a display and the extension payload,
      # which a pull-request build does not assemble.
      - name: Run the connector tests
        working-directory: jetbrains_plugin
        shell: bash
        run: >
          ./gradlew test
          --tests "org.zoocode.jetbrains.terminal.RawOutputTtyConnectorTest"
          --tests "org.zoocode.jetbrains.util.JcefSupportTest"
          --tests "org.zoocode.jetbrains.descriptor.PluginDescriptorTest"
          --tests "org.zoocode.jetbrains.terminal.TerminalPtyBuilderTest"
          --tests "org.zoocode.jetbrains.terminal.ShellIntegrationOutputStateTest"
          --tests "org.zoocode.jetbrains.terminal.TerminalShellReadinessTest"
          --no-configuration-cache

      - name: Build the plugin
        working-directory: jetbrains_plugin
        shell: bash
        run: ./gradlew buildPlugin --no-configuration-cache

      - name: Reject packaged references to the 2026.3-removed terminal API
        working-directory: jetbrains_plugin
        shell: bash
        run: ./gradlew verifyPackagedBytecode --no-configuration-cache

      - name: Verify plugin compatibility with the exact IDEA 2026.3 build
        working-directory: jetbrains_plugin
        shell: bash
        run: >
          ./gradlew runPluginVerifier
          -PverifierLocalIde="build/ideaIC-${IDEA_263_BUILD}"
          --no-configuration-cache

      - name: Smoke check the 2026.3 createTtyConnector dispatch
        working-directory: jetbrains_plugin
        shell: bash
        run: >
          ./gradlew smoke263Dispatch
          -PsmokeLocalIde="build/ideaIC-${IDEA_263_BUILD}"
          --no-configuration-cache

  windows-verify:
    name: Windows terminal tests and PowerShell 5.1 smoke
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the JetBrains plugin
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # git rev-parse reports the exact checkout that ran. A pull_request event
      # can test a merge commit, so the recorded value, not the branch head, is
      # the validated one.
      - name: Record the run identity
        shell: powershell
        run: |
          $identity = @"
          Validation: GitHub Actions Windows runner
          Checkout: $env:GITHUB_WORKSPACE
          Tested commit: $(git rev-parse HEAD)
          OS: windows-latest
          JDK: temurin 17
          Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@
          Write-Output $identity
          Set-Content -Path windows-run-identity.txt -Value $identity

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The same build-only fixtures the Linux job creates: the Gradle build
      # reads these paths while it configures prepareSandbox, and the pull
      # request tests never package the real extension payload.
      - name: Create the sandbox input paths the Gradle build needs
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path jetbrains_plugin/plugins/zoo-code/extension | Out-Null
          New-Item -ItemType File -Force -Path jetbrains_plugin/plugins/zoo-code/extension/.keep | Out-Null
          New-Item -ItemType File -Force -Path jetbrains_plugin/prodDep.txt | Out-Null

      # RawOutputTtyConnectorTest runs its stub connector tests and skips the
      # Linux-only real-PTY test. WindowsConPtyProcessTest holds the real
      # ConPTY process tests and is skipped on any non-Windows runner.
      #
      # The runner wraps `powershell` scripts in $ErrorActionPreference =
      # 'stop'. In Windows PowerShell 5.1, `2>&1` on a native command turns
      # every stderr line into an ErrorRecord, and under 'stop' the first
      # Gradle stderr line would abort the step before the exit-code line
      # runs. The 2>&1 merge therefore happens inside cmd.exe, before
      # PowerShell sees any bytes, so the pipeline carries plain strings.
      # cmd /c propagates the Gradle wrapper exit code into $LASTEXITCODE.
      # A missing or empty log means the upload step would publish no
      # evidence, so that failure is surfaced explicitly.
      - name: Run the Windows terminal tests
        working-directory: jetbrains_plugin
        shell: powershell
        run: |
          $taskList = @(
            'test'
            '--tests org.zoocode.jetbrains.terminal.RawOutputTtyConnectorTest'
            '--tests org.zoocode.jetbrains.terminal.TerminalPtyBuilderTest'
            '--tests org.zoocode.jetbrains.terminal.ShellIntegrationOutputStateTest'
            '--tests org.zoocode.jetbrains.terminal.TerminalShellReadinessTest'
            '--tests org.zoocode.jetbrains.terminal.WindowsConPtyProcessTest'
            '--no-configuration-cache'
          )
          cmd /c "gradlew.bat $($taskList -join ' ') 2>&1" | Tee-Object -FilePath ..\windows-test-log.txt
          $gradleExit = $LASTEXITCODE
          $testLog = Get-Item -LiteralPath ..\windows-test-log.txt -ErrorAction SilentlyContinue
          if ($null -eq $testLog -or $testLog.Length -eq 0) {
            Write-Output '::error::the Gradle test log is missing or empty, so the artifact step would publish no evidence'
            exit 1
          }
          exit $gradleExit

      # The "powershell" shell is Windows PowerShell 5.1; "pwsh" would run
      # PowerShell 7 and would not validate the 5.1 parser path. The script
      # signals failure with a terminating error, so a catch decides the step
      # outcome; $LASTEXITCODE is stale here because the script's last native
      # command is cmd.exe.
      - name: Smoke check the PowerShell integration profile on Windows PowerShell 5.1
        shell: powershell
        run: |
          try {
            & .\jetbrains_plugin\smoke\PowerShellIntegrationCheck.ps1 2>&1 | Tee-Object -FilePath windows-smoke-log.txt
          } catch {
            $_ | Out-String | Tee-Object -FilePath windows-smoke-log.txt -Append
            exit 1
          }
          exit 0

      - name: Store the test results, logs, and run identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pr-results-${{ github.sha }}-windows-latest-jdk17
          path: |
            jetbrains_plugin/build/test-results/test/*.xml
            jetbrains_plugin/build/reports/tests/test/**
            windows-test-log.txt
            windows-smoke-log.txt
            windows-run-identity.txt
          if-no-files-found: warn
