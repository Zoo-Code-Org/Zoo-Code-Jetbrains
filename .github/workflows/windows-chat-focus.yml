name: Windows chat focus E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-chat-focus.yml"
      - "jetbrains_plugin/scripts/ui-harness/**"
      - "jetbrains_plugin/src/main/kotlin/**"
      - "jetbrains_plugin/build.gradle.kts"
      - "jetbrains_plugin/gradle.properties"
      - "extension_host/**"

permissions:
  contents: read

concurrency:
  group: windows-chat-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build this checkout with the pinned extension
    # Keep native dependency builds independent of ubuntu-latest image changes.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Match the extension used in the existing focus investigation.
      ZOO_EXTENSION_VERSION: "3.84.0"
      # This job packages the plugin; headful tests use the IDE's bundled JCEF.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension_host/package-lock.json
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends build-essential libx11-dev libxkbfile-dev pkg-config
      - name: Validate the local streaming fixture
        working-directory: jetbrains_plugin/scripts/ui-harness
        run: python3 -m unittest -v test_streaming_fixture.py
      - name: Prepare extension host source
        run: ./scripts/setup.sh --skip-deps --verbose
      - name: Cache the cross-platform VS Code runtime
        uses: actions/cache@v4
        with:
          path: jetbrains_plugin/platform.zip
          key: chat-focus-platform-${{ hashFiles('jetbrains_plugin/gradle.properties', 'jetbrains_plugin/genPlatform.gradle') }}
      - name: Build the full plugin without publishing
        run: ./scripts/build.sh --mode release --clean --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: chat-focus-plugin
          path: jetbrains_plugin/build/distributions/*.zip
          if-no-files-found: error

  windows-e2e:
    name: Native typing and streaming chat (IDEA ${{ matrix.ide }})
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - ide: "2025.3"
            sha256: "6f7234b57444371c3af02ab31a15f76dd1d6e5e32eaabc96722777a9addcd023"
          - ide: "2026.2.1"
            sha256: "8aa16db629952300ab74d2d5e095150d1a534593e65bbbbd795b859759c00cbc"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate fixture HTTP behavior on Windows
        run: python -m unittest discover -s jetbrains_plugin/scripts/ui-harness -p test_streaming_fixture.py -v
      - uses: actions/download-artifact@v4
        with:
          name: chat-focus-plugin
          path: focus-plugin
      - name: Download pinned Windows IDE with bundled JBR and JCEF
        env:
          IDE_VERSION: ${{ matrix.ide }}
          IDE_SHA256: ${{ matrix.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force focus-evidence | Out-Null
          $archive = "idea-$env:IDE_VERSION.win.zip"
          $url = "https://download.jetbrains.com/idea/$archive"
          # Pinned from JetBrains' <archive>.sha256, not resolved from a latest feed.
          $expected = $env:IDE_SHA256
          if ($expected -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid vendor checksum' }
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/idea.zip"
          $actual = (Get-FileHash "$env:RUNNER_TEMP/idea.zip" -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'IDE archive checksum mismatch' }
          "$url SHA256=$actual" | Set-Content focus-evidence/ide-download.txt
          Expand-Archive "$env:RUNNER_TEMP/idea.zip" "$env:RUNNER_TEMP/focus-ide"
          Remove-Item "$env:RUNNER_TEMP/idea.zip"
          $launchers = @(Get-ChildItem "$env:RUNNER_TEMP/focus-ide" -Filter idea64.exe -Recurse)
          if ($launchers.Count -ne 1) { throw 'Expected exactly one native IDE launcher' }
          $ideDir = $launchers[0].Directory.Parent.FullName
          "FOCUS_IDE_DIR=$ideDir" >> $env:GITHUB_ENV
      - name: Run native desktop preflight and two-turn streaming focus test
        run: |
          $plugins = @(Get-ChildItem focus-plugin -Filter *.zip)
          if ($plugins.Count -ne 1) { throw 'Expected exactly one plugin distribution' }
          & ./jetbrains_plugin/scripts/ui-harness/run-windows.ps1 `
            -IdeDir $env:FOCUS_IDE_DIR -PluginZip $plugins[0].FullName `
            -EvidenceDir "$env:GITHUB_WORKSPACE/focus-evidence"
      - name: Upload focus traces, screenshots, and run identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-chat-focus-${{ matrix.ide }}-${{ github.sha }}
          path: focus-evidence/
          if-no-files-found: error
